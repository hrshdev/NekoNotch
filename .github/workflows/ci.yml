# Every push to main and every pull request: build, then produce all three installers so a broken
# package (WiX / MSIX manifest / publish) is caught before release, not on release day.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $ver = "0.9.${{ github.run_number }}"
          echo "APP_VERSION=$ver" >> $env:GITHUB_ENV
          echo "TAG_NAME=v$ver" >> $env:GITHUB_ENV
          Write-Host "Building version $ver (tag v$ver)"

      - name: NuGet cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: |
          dotnet restore OrixNotch.sln
          dotnet build OrixNotch.sln -c Release --no-restore -p:Version=${{ env.APP_VERSION }}

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Package (exe, MSI, MSIX)
        shell: pwsh
        run: |
          ./packaging/Build-Exe.ps1 -Version $env:APP_VERSION
          ./packaging/Build-Msi.ps1 -Version $env:APP_VERSION
          ./packaging/Build-Msix.ps1 -Version $env:APP_VERSION

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: NekoNotch-${{ env.APP_VERSION }}
          path: |
            publish/exe/NekoNotch.exe
            publish/NekoNotch-Setup.msi
            publish/NekoNotch-Setup.msix
          retention-days: 14

      - name: Ensure NekoNotch.exe
        shell: pwsh
        run: |
          if (-not (Test-Path publish/exe/NekoNotch.exe)) {
            $ex = Get-ChildItem publish/exe -Filter *.exe | Select-Object -First 1
            Copy-Item $ex.FullName publish/exe/NekoNotch.exe
          }

      - name: Publish Direct .exe and Setup to GitHub Releases
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: NekoNotch ${{ env.TAG_NAME }}
          make_latest: true
          files: |
            publish/exe/NekoNotch.exe
            publish/NekoNotch-Setup.msi
