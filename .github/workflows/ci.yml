# Every push to main and every pull request: build, then produce all three installers so a broken
# package (WiX / MSIX manifest / publish) is caught before release, not on release day.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: |
          dotnet restore OrixNotch.sln
          dotnet build OrixNotch.sln -c Release --no-restore

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Package (exe, MSI, MSIX)
        shell: pwsh
        run: |
          ./packaging/Build-Exe.ps1
          ./packaging/Build-Msi.ps1
          ./packaging/Build-Msix.ps1

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: NekoNotch-${{ github.sha }}
          path: |
            publish/exe/OrixNotch.exe
            publish/NekoNotch.msi
            publish/NekoNotch.msix
          retention-days: 14

      - name: Prepare NekoNotch.exe
        shell: pwsh
        run: |
          Copy-Item publish/exe/OrixNotch.exe publish/exe/NekoNotch.exe

      - name: Publish Direct .exe to GitHub Releases
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v0.9.0
          name: NekoNotch v0.9.0 (Direct .exe)
          files: |
            publish/exe/NekoNotch.exe
            publish/NekoNotch.msi
