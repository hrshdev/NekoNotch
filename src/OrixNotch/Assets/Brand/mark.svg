<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="NekoNotch Mochi pet logo">
  <defs>
    <linearGradient id="mochiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4F4F6"/>
      <stop offset="40%" stop-color="#EDEDEF"/>
      <stop offset="100%" stop-color="#C5C6CB"/>
    </linearGradient>
    <radialGradient id="mochiGloss" cx="50%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Mochi Body Squircle -->
  <rect x="12" y="26" width="76" height="48" rx="16" ry="16" fill="url(#mochiGrad)" stroke="#B0B2B8" stroke-width="1.2"/>
  <!-- Gloss highlight -->
  <ellipse cx="50" cy="32" rx="26" ry="7" fill="url(#mochiGloss)"/>
  <!-- Rosy Blush Cheeks (compact width) -->
  <ellipse cx="20.5" cy="53.5" rx="3.2" ry="2.4" fill="#FF7896" opacity="0.45"/>
  <ellipse cx="79.5" cy="53.5" rx="3.2" ry="2.4" fill="#FF7896" opacity="0.45"/>
  <!-- Left Eye Round Circle -->
  <circle cx="41.5" cy="49" r="7.0" fill="#1A1412"/>
  <circle cx="39.8" cy="47.3" r="2.0" fill="#FFFFFF"/>
  <!-- Right Eye Round Circle -->
  <circle cx="58.5" cy="49" r="7.0" fill="#1A1412"/>
  <circle cx="56.8" cy="47.3" r="2.0" fill="#FFFFFF"/>
</svg>
